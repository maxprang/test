[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restore-guard"
version = "0.1.0"
description = "Proves that homelab backups can actually be restored"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
restore-guard = "restore_guard.cli:main"

[tool.setuptools.packages.find]
include = ["restore_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
